{% comment %}
Non-form formset errors. Same change as tailwind/errors.html — see there.
{% endcomment %}
{% if formset.non_form_errors %}
    <div class="alert alert-error mb-4" role="alert">
        <div>
            {% if formset_error_title %}
                <p class="font-bold mb-1">{{ formset_error_title }}</p>
            {% endif %}
            <ul>
                {{ formset.non_form_errors|unordered_list }}
            </ul>
        </div>
    </div>
{% endif %}
