# Per-checkout values (ports, image name) come from .env, which init-docker.sh
# writes; this file stays as committed. web builds the image once and the
# celery services reuse it.
x-app: &app
  image: speedpy-web${IMAGE_SUFFIX:-}
  restart: always

  volumes:
    - .:/code
  links:
    - db
    - redis
  depends_on:
    - db
    - redis
services:
  redis:
    image: redis:8
  #    ports:
  #      - "6379:6379"

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=speedpycom
      - POSTGRES_PASSWORD=speedpycom
      - POSTGRES_DB=speedpycom
    # Named volume: an anonymous one is replaced by an empty database on every
    # `docker compose down` + `up`. init-docker.sh still starts clean (down -v).
    volumes:
      - db_data:/var/lib/postgresql
  #    ports:
  #      - "5432:5432"
  web:
    <<: *app
    build: .
    command: bash dev.sh
    ports:
      - "127.0.0.1:${WEB_PORT:-9000}:${WEB_PORT:-9000}"

  media:
    image: nginx
    volumes:
      - ./media:/usr/share/nginx/html
    ports:
      - "127.0.0.1:${MEDIA_PORT:-9001}:80"
  #  tailwind:
  #    image: node:20.11-bullseye
  #    volumes:
  #      - .:/code
  #    environment:
  #      - NODE_ENV=development
  #    command: /bin/bash -c 'cd /code/ && npm install && npm run tailwind:watch'
  celery:
    <<: *app
    pull_policy: never
    command: celery -A project.celeryapp:app  worker -Q default -n speedpycom.%h --loglevel=DEBUG --max-memory-per-child=512000 --concurrency=1

  celery-beat:
    <<: *app
    pull_policy: never
    command: celery -A project.celeryapp:app beat -S redbeat.RedBeatScheduler  --loglevel=DEBUG --pidfile /tmp/celerybeat.pid

